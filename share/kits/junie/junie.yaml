# Workload kit: JetBrains Junie CLI (not a built-in sbx agent).
# Use as `agent = "junie"` in agentbox.toml, or directly: sbx run ~/.config/agentbox/kits/junie
# The recipe (junie.dockerfile) is the v2 sandbox.image + entrypoint; sbx builds it on first
# use (host Docker Buildx, or its kit-builder sandbox when Docker isn't running).
schemaVersion: "3"
kind: workload
version: "2.0.0"
displayName: JetBrains Junie CLI
description: Junie CLI on the Docker shell template
sourceUrl: https://github.com/sedurCode/agentbox
provides: ["junie"]

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      # The installer below downloads from junie.jetbrains.com.
      install:
        allow:
          - "junie.jetbrains.com"
          - "*.jetbrains.com"
      # Starting point only. Run once, then check `sbx policy log` for blocked
      # hosts and add what Junie really needs to the profile's `allow` list.
      runtime:
        allow:
          - "junie.jetbrains.com"
          - "*.jetbrains.com"
          - "*.jetbrains.ai"
          - "*.grazie.ai"

  # MIGRATION NOTE: kept as install hooks (not recipe layers): the installer is an unpinned
  # `curl | bash` that self-updates, so baking it gives no reproducibility and would need
  # network at build time.
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: "curl -fsSL https://junie.jetbrains.com/install.sh | bash"
          user: "1000"
          env: [HTTP_PROXY, HTTPS_PROXY, http_proxy, https_proxy, NO_PROXY, no_proxy]
          description: Install Junie CLI for the agent user
        - command: >-
            for p in /home/agent/.local/bin/junie /home/agent/.junie/bin/junie; do
            [ -x "$p" ] && ln -sf "$p" /usr/local/bin/junie && exit 0; done;
            f=$(find /home/agent -maxdepth 5 -type f -name junie -perm -u+x 2>/dev/null | head -n1);
            [ -n "$f" ] && ln -sf "$f" /usr/local/bin/junie
          user: "0"
          description: Put junie on PATH

  - type: com.docker.sandbox/agent-context@2
    config:
      filename: AGENTS.md
      content: |
        # Sandbox
        You are Junie running inside a Docker Sandboxes microVM. Network egress is
        allow-listed and there are no git push credentials here; commit locally and
        let the user review and push.
