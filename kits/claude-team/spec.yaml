# Mixin: Claude Code model routing.
# Main loop on opusplan (Opus in plan mode, Sonnet when executing) plus three
# user-level subagents: reader (Haiku), worker (Sonnet), architect (Opus).
# Add to Claude profiles only: kits = [..., "claude-team"]
schemaVersion: "2"
kind: mixin
name: claude-team
displayName: Claude model routing
description: opusplan main loop + haiku reader / sonnet worker / opus architect subagents

environment:
  variables:
    ANTHROPIC_MODEL: "opusplan"

setup:
  install:
    - user: "1000"
      description: Install user-level Claude subagents
      command: |
        set -e
        d="${CLAUDE_CONFIG_DIR:-$HOME/.claude}/agents"; mkdir -p "$d"

        cat > "$d/reader.md" <<'EOF'
        ---
        name: reader
        description: Fast, cheap read-only lookup. Use PROACTIVELY to find files, locate symbols, read code or docs and summarise them. Returns findings with file:line references, never edits.
        model: haiku
        tools: Read, Grep, Glob
        ---
        You locate and summarise. Answer the question asked, cite file:line, quote only the lines that matter. Keep the reply short; don't propose designs or edit anything.
        EOF

        cat > "$d/worker.md" <<'EOF'
        ---
        name: worker
        description: Implements a well-specified change - edits code, runs tests, fixes failures. Use for any task with a clear plan or spec; give it the files and acceptance criteria.
        model: sonnet
        tools: Read, Edit, Write, Bash, Grep, Glob
        ---
        Implement exactly the change described, matching the surrounding code style. Run the relevant tests and report: files changed, test result, anything you could not do. Don't widen scope.
        EOF

        cat > "$d/architect.md" <<'EOF'
        ---
        name: architect
        description: Design and review for hard problems - cross-module changes, security-sensitive code, tricky bugs, trade-offs. Use before large changes or when a worker gets stuck. Read-only.
        model: opus
        tools: Read, Grep, Glob
        ---
        Produce a concrete plan: the files to touch, the approach and why, risks, and how to verify. Name trade-offs and make a recommendation. Don't edit files.
        EOF

agentInstructions:
  content: |
    ## Delegation
    Save tokens by delegating:
    - `reader` (Haiku) for finding and reading code or docs; don't read large files yourself.
    - `worker` (Sonnet) for implementing a clear, scoped change and running its tests.
    - `architect` (Opus) for design decisions, reviews and stuck bugs, before large changes.
    You coordinate, give each subagent precise inputs, and check its results.
