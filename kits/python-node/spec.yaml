# Mixin: generic Python + Node dev tools INSIDE the sandbox.
schemaVersion: "2"
kind: mixin
name: python-node
displayName: Python and Node
description: Python 3 + venv/pip, Node, git

permissions:
  network:
    allow:
      - "ports.ubuntu.com"
      - "archive.ubuntu.com"
      - "security.ubuntu.com"
      - "deb.debian.org"

setup:
  install:
    - command: >-
        apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        python3 python3-venv python3-pip nodejs git ca-certificates curl &&
        rm -rf /var/lib/apt/lists/*
      user: "0"
      description: Install Python, Node and git

agentInstructions:
  content: |
    ## Dev tools
    Python 3 with venv and pip, Node and git are installed.
