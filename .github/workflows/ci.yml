name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4   # TODO: pin to SHA
      - uses: actions/setup-python@v5   # TODO: pin to SHA
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax checks
        run: |
          python -m py_compile bin/agentbox share/hosttool
          bash -n install.sh
          sh -n share/agentbox-launcher
          sh -n share/jobwrap
          sh -n share/jobprogress
          if command -v luac >/dev/null; then luac -p share/rex/*.lua; else echo "luac not found: skipping the Lua syntax check"; fi
      - name: Windows installer parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content install.ps1 -Raw))
          Get-Content share/agentbox.cmd | Out-Null

  secrets:
    # gitleaks over the whole history. False positives go in .gitleaksignore (old commits) or get a
    # `gitleaks:allow` comment on the line. The release binary is pinned by version and checksum.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4   # TODO: pin to SHA
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          f=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Scan
        run: ./gitleaks git . --no-banner --redact --verbose
